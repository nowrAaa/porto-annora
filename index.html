<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portofolio</title>
  <meta name="description" content="Portofolio mahasiswa Sistem Informasi Bisnis.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#proyek">Langsung ke proyek</a>

  <header class="nav">
    <nav aria-label="Navigasi utama">
      <a href="#tentang">Tentang</a>
      <a href="#keahlian">Keahlian</a>
      <a href="#proyek">Proyek</a>
      <a href="#sertifikat">Sertifikat</a>
      <a href="#pendidikan">Pendidikan</a>
      <a href="#kontak">Kontak</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-text">
        <p class="hero-role" id="role"></p>
        <h1 id="name"></h1>
        <p class="hero-intro" id="intro"></p>
        <div class="hero-actions">
          <a class="btn primary" href="#proyek">Lihat proyek</a>
          <a class="btn" id="cv-link" href="#" target="_blank" rel="noopener">Unduh CV</a>
        </div>
      </div>

    </section>

    <section id="tentang" class="block">
      <h2>Tentang saya</h2>
      <div class="about">
        <p id="about-text"></p>
        <dl id="facts"></dl>
      </div>
    </section>

    <section id="keahlian" class="block">
      <h2>Keahlian</h2>
      <div class="skills" id="skills"></div>
    </section>

    <section id="proyek" class="block">
      <h2>Proyek</h2>
      <div class="projects" id="projects"></div>
    </section>

    <section id="sertifikat" class="block">
      <h2>Sertifikat</h2>
      <div class="certs" id="certs"></div>
    </section>

    <section id="pendidikan" class="block">
      <h2>Pendidikan</h2>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <section id="kontak" class="block contact">
      <h2>Kontak</h2>
      <p id="contact-text"></p>
      <ul class="links" id="links"></ul>
    </section>
  </main>

  <footer class="foot">
    <p id="footer"></p>
  </footer>

  <dialog id="lightbox" aria-label="Pratinjau gambar">
    <button type="button" id="lightbox-close">Tutup</button>
    <img id="lightbox-img" alt="">
    <iframe id="lightbox-pdf" title="Pratinjau PDF" hidden></iframe>
    <p id="lightbox-caption"></p>
    <a id="lightbox-open" href="#" target="_blank" rel="noopener" hidden>Buka PDF di tab baru</a>
  </dialog>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
